<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creator Duplicate checker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}?v=24">
</head>
<body>
  <main>
    <h1>Creator Duplicate checker</h1>
    <p class="lead">Paste handles, @names, or profile links. One on each line.</p>
    <form id="check-form">
      <label>
        List
        <textarea id="check-text" rows="8" spellcheck="false" placeholder="@name&#10;https://www.instagram.com/name/&#10;anothername"></textarea>
      </label>
      <div class="actions">
        <button type="submit" id="check-button">Check now</button>
      </div>
    </form>
    <section id="result" hidden>
      <div id="message"></div>
      <div id="unique" hidden>
        <div class="unique-actions">
          <button type="button" id="copy-all">Copy all</button>
          <button type="button" id="copy-urls">Copy URLs</button>
        </div>
        <table id="url-table">
          <thead>
            <tr>
              <th>Creator Handle</th>
              <th>Creator Profile URL</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="pager" id="pager" hidden>
        <button type="button" id="page-prev">Previous</button>
        <span id="page-label">Page 1 of 1</span>
        <button type="button" id="page-next">Next</button>
      </div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}?v=24"></script>
</body>
</html>
